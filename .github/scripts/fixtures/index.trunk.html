<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#1e1e1e" />
    <title>Open CAD Studio Web App</title>
    <link rel="icon" href="/sipilcad/logo-45c33c4b340416d6.svg" integrity="sha384-vfZpA76CSyUk3p+O4z9crsXrWTLdI+vzcgZAsaI+pSKRNPDIJoPCZ/bkkYSkRBoo"/>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #1e1e1e; }
      canvas { display: block; }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #1e1e1e;
        color: #cfcfcf;
        font-family: system-ui, sans-serif;
        z-index: 9999;
        transition: opacity 0.4s ease;
      }
      #loading.hide { opacity: 0; pointer-events: none; }
      #loading .title { font-size: 22px; font-weight: 600; letter-spacing: 0.5px; }
      #loading .title span { color: #3399e6; }
      #loading .sub { font-size: 12px; color: #777; }
      #loading .spinner {
        width: 46px;
        height: 46px;
        border: 4px solid #2e2e2e;
        border-top-color: #3399e6;
        border-radius: 50%;
        animation: ocs-spin 0.9s linear infinite;
      }
      @keyframes ocs-spin { to { transform: rotate(360deg); } }
    </style>
    
<script type="module">
import init, * as bindings from '/sipilcad/OpenCADStudio-a106f805b3db8319.js';
const wasm = await init({ module_or_path: '/sipilcad/OpenCADStudio-a106f805b3db8319_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
    
    
    
    
    
  <link rel="modulepreload" href="/sipilcad/OpenCADStudio-a106f805b3db8319.js" crossorigin="anonymous" integrity="sha384-jzNWcA42AFJe+OES5Pa/2aavYIkMHcU3zu1HI13/obMbIv2YyTu6AWQc7OVE7vbw"><link rel="modulepreload" href="/sipilcad/snippets/OpenCADStudio-37af28018e89eb13/web/clipboard.js" crossorigin="anonymous" integrity="sha384-Wut6cH3WOIv3yBNSaEH+LhCF12yFaz1r6WMxaZq0/Fb2NwdMgUXVtR2xdkSFp1yJ"><link rel="preload" href="/sipilcad/OpenCADStudio-a106f805b3db8319_bg.wasm" crossorigin="anonymous" integrity="sha384-/6Muosdcb1L9PkJ+VAlw7ctGvqCm1EBqX+eyywvPhhne0GBdS6fi6W+MWCWp56av" as="fetch" type="application/wasm"></head>
  <body>
    <div id="loading">
      <div class="spinner"></div>
      <div class="title">Open <span>CAD</span> Studio</div>
      <div class="sub">Loading…</div>
    </div>
    <script>
      (() => {
        const splash = document.getElementById("loading");
        fetch("locale-labels.json").then(response => response.json()).then(labels => {
          let saved;
          try {
            saved = JSON.parse(localStorage.getItem("opencadstudio.settings"))?.settings?.language;
          } catch {}
          const preferred = navigator.languages?.length ? navigator.languages : [navigator.language];
          const requested = typeof saved === "string" && saved !== "system" ? [saved, ...preferred] : preferred;
          const available = Object.keys(labels);
          let locale = "en-US";
          for (const candidate of requested) {
            try {
              const language = new Intl.Locale(candidate);
              const match = available.find(value => value.toLowerCase() === language.baseName.toLowerCase())
                || (language.language === "zh"
                  ? (language.maximize().script === "Hant" ? "zh-TW" : "zh-CN")
                  : available.find(value => value.startsWith(language.language + "-")));
              if (match) { locale = match; break; }
            } catch {}
          }
          document.title = labels[locale].title;
          document.documentElement.lang = locale;
          document.documentElement.dir = locale === "ar-SA" ? "rtl" : "ltr";
          const caption = splash?.querySelector(".sub");
          if (caption) caption.textContent = labels[locale].loading;
        }).catch(() => {});
        const done = () => {
          if (!splash) return;
          splash.classList.add("hide");
          setTimeout(() => splash.remove(), 450);
        };
        if (document.querySelector("canvas")) return done();
        const observer = new MutationObserver(() => {
          if (document.querySelector("canvas")) {
            observer.disconnect();
            done();
          }
        });
        observer.observe(document.body, { childList: true, subtree: true });
      })();
    </script>
  </body>
</html>
