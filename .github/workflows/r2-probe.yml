# SEMENTARA: probe 403 dari R2 publik (dihapus setelah diagnosis). Hanya membaca satu URL publik.
name: R2 probe
on:
  push:
    paths:
      - '.github/workflows/r2-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - name: Probe public URL with different clients
        env:
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
        shell: bash
        run: |
          URL="${R2_PUBLIC_URL}/_dryrun/OpenCADStudio-a307ebdc394fb5bc_bg.wasm"
          for ua in "curl/8.5.0" "Python-urllib/3.10" "release-check/1.0 (+https://github.com/zlabx)" "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -I -H "Origin: https://sipilstock.com" -A "$ua" "$URL" || true)
            echo "::notice title=probe::HEAD UA='${ua:0:30}' -> $code"
          done
          code=$(curl -s -o /dev/null -w "%{http_code}" -I -H "Origin: https://sipilstock.com" -H "User-Agent:" "$URL" || true)
          echo "::notice title=probe::HEAD tanpa UA -> $code"
          echo "::notice title=probe::header respons (UA curl):"
          curl -s -I -H "Origin: https://sipilstock.com" -A "curl/8.5.0" "$URL" | tr -d '\r' | head -12 | while IFS= read -r l; do echo "::notice title=probe-hdr::$l"; done
          echo "::notice title=probe::body 403 (UA Python-urllib): $(curl -s -A 'Python-urllib/3.10' -r 0-0 "$URL" | head -c 200 | tr '\n' ' ')"
          python3 - <<'PY'
          import os, urllib.request, urllib.error
          url = os.environ["R2_PUBLIC_URL"] + "/_dryrun/OpenCADStudio-a307ebdc394fb5bc_bg.wasm"
          for ua in (None, "release-check/1.0"):
              req = urllib.request.Request(url, method="HEAD", headers={"Origin": "https://sipilstock.com", **({"User-Agent": ua} if ua else {})})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r: code = r.status
              except urllib.error.HTTPError as e: code = e.code
              print(f"::notice title=probe::python urllib UA={ua!r} -> {code}")
          PY
