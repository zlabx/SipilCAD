<!doctype html>
<html lang="en">

    <link rel="manifest" href="app.webmanifest" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#1e1e1e" />
    <title>SipilCAD</title>
    <link data-trunk rel="icon" href="assets/logo-small.svg" />
    <style>
      /* PT Sans (ParaType, SIL OFL 1.1; licence text: OFL-PTSans.txt), used unmodified for the splash only. */
      @font-face { font-family: "PT Sans"; font-weight: 400; font-style: normal; font-display: block;
        src: url("fonts/PT_Sans-Web-Regular.ttf") format("truetype"); }
      @font-face { font-family: "PT Sans"; font-weight: 700; font-style: normal; font-display: block;
        src: url("fonts/PT_Sans-Web-Bold.ttf") format("truetype"); }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #1e1e1e; }
      canvas { display: block; }
      /* Splash: jendela berwarna di tengah, kira-kira 30% lebar dan tinggi layar. Isinya berukuran
         satuan kontainer (cqmin) supaya ikut skala. #loading tetap latar penuh yang dihapus oleh
         skrip di bawah begitu canvas muncul (kelas .hide = fade-out). Teks .sub diganti skrip sesuai bahasa. */
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1e1e1e;
        font-family: system-ui, sans-serif;
        z-index: 9999;
        transition: opacity 0.4s ease;
      }
      #loading.hide { opacity: 0; pointer-events: none; }
      #loading .splash-window {
        position: relative;
        width: min(max(30vw, 360px), 94vw);
        height: max(30vh, 210px);
        container-type: size;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #7B2DE5;
        color: #fff;
        font: 16px "PT Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      }
      #loading .brand {
        position: absolute;
        top: 8cqmin;
        inset-inline-start: 8cqmin;
        display: flex;
        align-items: center;
        gap: 3cqmin;
        font-size: 7cqmin;
        font-weight: 700;
        letter-spacing: 0.2px;
      }
      #loading .brand svg { width: 10.5cqmin; height: 10.5cqmin; display: block; }
      #loading .splash-title { text-align: center; }
      #loading .splash-product { font-size: 19cqmin; font-weight: 700; line-height: 1.1; letter-spacing: 0.01em; }
      #loading .splash-year { margin-top: 4cqmin; font-size: 8.5cqmin; font-weight: 400; line-height: 1; letter-spacing: 0.2em; }
      #loading .sub {
        position: absolute;
        bottom: 7cqmin;
        inset-inline-start: 8cqmin;
        font-size: 5.5cqmin;
        font-weight: 400;
        animation: ocs-pulse 1.4s ease-in-out infinite;
      }
      @keyframes ocs-pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #loading .sub { animation: none; } }
    </style>
    <!-- PT Sans for the splash (web/pt-sans, from the rebrand kit): the fonts go to fonts/, the licence text next to this page. -->

        <div class="splash-title">
          <div class="splash-product">SipilCAD</div>

        <div class="sub">Loading…</div>
      </div>
    </div>
    <script src="ocs-control.js" defer></script>
    <script>
      // Offline support: register the service worker. It is copied next to
      // this page by Trunk (see the copy-file link in <head>), so the
      // relative URL resolves to /app/sw.js and the registration scope is
      // /app/ — the whole app. Registered immediately (not on load) so the
      // worker starts capturing this visit's asset requests as early as
      // possible. sw.js never reloads the page on update: a new worker
      // waits until every tab on the old version has closed.
      (() => {
        if (!("serviceWorker" in navigator)) return;
        navigator.serviceWorker.register("sw.js").catch(error => {
          console.warn("service worker registration failed; offline support disabled:", error);
        });
      })();
    </script>
    <script>
      (() => {
        const splash = document.getElementById("loading");
        fetch("locale-labels.json").then(response => response.json()).then(labels => {
          let saved;
          try {
            saved = JSON.parse(localStorage.getItem("opencadstudio.settings"))?.settings?.language;
          } catch {}
          const preferred = navigator.languages?.length ? navigator.languages : [navigator.language];
          const requested = typeof saved === "string" && saved !== "system" ? [saved, ...preferred] : preferred;
          const available = Object.keys(labels);
          let locale = "en-US";
          for (const candidate of requested) {
            try {
              const language = new Intl.Locale(candidate);
              const match = available.find(value => value.toLowerCase() === language.baseName.toLowerCase())
                || (language.language === "zh"
                  ? (language.maximize().script === "Hant" ? "zh-TW" : "zh-CN")
                  : available.find(value => value.startsWith(language.language + "-")));
              if (match) { locale = match; break; }
            } catch {}
          }
          document.title = labels[locale].title;
          document.documentElement.lang = locale;
          document.documentElement.dir = locale === "ar-SA" ? "rtl" : "ltr";
          const caption = splash?.querySelector(".sub");
          if (caption) caption.textContent = labels[locale].loading;
        }).catch(() => {});
        const done = () => {
          if (!splash) return;
          splash.classList.add("hide");
          setTimeout(() => splash.remove(), 450);
        };
        if (document.querySelector("canvas")) return done();
        const observer = new MutationObserver(() => {
          if (document.querySelector("canvas")) {
            observer.disconnect();
            done();
          }
        });
        observer.observe(document.body, { childList: true, subtree: true });
      })();
    </script>
